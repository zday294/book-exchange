# Weekly pull requests for out-of-date dependencies. Minor and patch updates are grouped so
# they arrive as one PR per area instead of a flood. Major updates are NOT proposed: each
# ecosystem stays on its current major version (for example Spring Boot 3.x, Java 21, Vite 7)
# until someone deliberately upgrades by hand. To move up, make the change yourself, then
# it simply continues from the new major. Security updates are separate and are not blocked
# by these rules. (GitHub Actions are the exception: their majors are still proposed.)
version: 2
updates:
  - package-ecosystem: maven
    directory: /backend
    schedule: { interval: weekly }
    open-pull-requests-limit: 5
    groups:
      maven-minor-and-patch:
        update-types: [minor, patch]
    ignore:
      - dependency-name: "*"
        update-types: ["version-update:semver-major"]

  - package-ecosystem: npm
    directory: /frontend
    schedule: { interval: weekly }
    open-pull-requests-limit: 5
    groups:
      npm-minor-and-patch:
        update-types: [minor, patch]
    ignore:
      - dependency-name: "*"
        update-types: ["version-update:semver-major"]

  - package-ecosystem: github-actions
    directory: /
    schedule: { interval: weekly }
    groups:
      actions-minor-and-patch:
        update-types: [minor, patch]
    # No ignore rule here: GitHub Actions are pinned to a major tag (actions/checkout@v4), so a new major is
    # how they get fixes and newer Node runtimes. Those PRs stay separate and are low risk.

  - package-ecosystem: docker
    directory: /backend
    schedule: { interval: weekly }
    ignore:
      - dependency-name: "*"
        update-types: ["version-update:semver-major"]

  - package-ecosystem: docker
    directory: /frontend
    schedule: { interval: weekly }
    ignore:
      - dependency-name: "*"
        update-types: ["version-update:semver-major"]
