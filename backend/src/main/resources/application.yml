spring:
  application:
    name: book-exchange-backend
  datasource:
    # Defaults match the local docker-compose database (see the root README).
    url: ${DB_URL:jdbc:postgresql://localhost:5433/bookexchange}
    username: ${DB_USER:bookexchange}
    password: ${DB_PASSWORD:bookexchange}
  jpa:
    open-in-view: false
    hibernate:
      # Liquibase is the only thing that changes the schema; Hibernate just checks it matches.
      ddl-auto: validate
  liquibase:
    change-log: classpath:db/changelog/db.changelog-master.yaml

server:
  port: ${PORT:8080}
  shutdown: graceful

springdoc:
  # Switch both off with SPRINGDOC_ENABLED=false (e.g. in production).
  api-docs:
    enabled: ${SPRINGDOC_ENABLED:true}
  swagger-ui:
    enabled: ${SPRINGDOC_ENABLED:true}
    operations-sorter: method
  paths-to-match: /api/**

management:
  endpoints:
    web:
      exposure:
        include: health
  endpoint:
    health:
      probes:
        enabled: true

app:
  cors:
    # Comma-separated list of origins allowed to call the API from a browser.
    allowed-origins: ${CORS_ALLOWED_ORIGINS:http://localhost:5173}
  events:
    # Live updates (Server-Sent Events): a comment line is sent this often so proxies keep idle connections open.
    heartbeat-millis: ${EVENTS_HEARTBEAT_MILLIS:15000}
    # Open live connections allowed at once (about one per open browser page), and how long one lasts
    # before the browser reconnects.
    max-subscribers: ${EVENTS_MAX_SUBSCRIBERS:1000}
    connection-minutes: ${EVENTS_CONNECTION_MINUTES:30}
  party:
    # How long one person's turn lasts in a party (seconds), and how long a person who closed the page still
    # counts as online (so a refresh or a moment without signal doesn't lose their turn).
    turn-seconds: ${PARTY_TURN_SECONDS:120}
    offline-grace-seconds: ${PARTY_OFFLINE_GRACE_SECONDS:30}
    # How often the party timer looks at running parties.
    tick-millis: ${PARTY_TICK_MILLIS:1000}
  amazon:
    # Hosts a submitted book link may use (subdomains such as www.amazon.com are allowed too).
    allowed-hosts: ${AMAZON_ALLOWED_HOSTS:amazon.com,amzn.to,a.co}
  cover:
    # Finds each book's cover after it is submitted (see backend/README.md). Switch off with COVER_LOOKUP_ENABLED=false.
    enabled: ${COVER_LOOKUP_ENABLED:true}
    image-url-template: ${COVER_IMAGE_URL_TEMPLATE:https://covers.openlibrary.org/b/isbn/%s-L.jpg}
    # covers.openlibrary.org redirects to archive.org's servers.
    allowed-image-hosts: ${COVER_ALLOWED_IMAGE_HOSTS:covers.openlibrary.org,archive.org}
    connect-timeout-ms: 3000
    total-timeout-ms: 8000
    max-image-bytes: 2000000
    max-redirects: 3
