# Liquibase master changelog. The project's only way to change the schema.
# Add new changes as NEW files under changes/ and include them below, in order.
# Never edit a changeset that has already been merged.
databaseChangeLog:
  - include:
      file: db/changelog/changes/001-create-exchange.sql
  - include:
      file: db/changelog/changes/002-create-book-submission.sql
  - include:
      file: db/changelog/changes/003-book-submission-indexes.sql
  - include:
      file: db/changelog/changes/004-seed-default-exchange.sql
  - include:
      file: db/changelog/changes/005-one-submission-per-person.sql
  - include:
      file: db/changelog/changes/006-exchange-host-token.sql
  - include:
      file: db/changelog/changes/007-exchange-mode.sql
  - include:
      file: db/changelog/changes/008-party-mode.sql
  - include:
      file: db/changelog/changes/009-cover-aspect-ratio.sql
  - include:
      file: db/changelog/changes/010-rename-amazon-url-to-book-url.sql
