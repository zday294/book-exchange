# Defaults for EVERY Spring test: nothing reaches the internet unless a test turns it on on purpose.
# (This file wins over src/main/resources/application.yml but loses to @TestPropertySource and @SpringBootTest(properties = ...),
# so a test that wants the real link check or cover lookup says so, with a faked LinkChecker / CoverHttp.)
app.link-check.enabled=false
app.cover.enabled=false
