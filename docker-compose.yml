# Local stack. Credentials here are throwaway values for local use only.
# Whole app:     docker compose up --build      (then open http://localhost:3000)
# Only the DB:   docker compose up -d db        (run the backend/front end from your IDE)
# Reset:         docker compose down -v         (wipes the data; the backend re-applies the Liquibase changelog)
# The database starts empty: the backend's Liquibase changelog creates the schema.
services:
  db:
    image: postgres:17
    environment:
      POSTGRES_DB: bookexchange
      POSTGRES_USER: bookexchange
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-bookexchange}
    ports:
      - "${POSTGRES_PORT:-5433}:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U bookexchange -d bookexchange"]
      interval: 5s
      timeout: 3s
      retries: 10

  backend:
    build: ./backend
    depends_on:
      db:
        condition: service_healthy
    environment:
      DB_URL: jdbc:postgresql://db:5432/bookexchange
      DB_USER: bookexchange
      DB_PASSWORD: ${POSTGRES_PASSWORD:-bookexchange}
    ports:
      - "${BACKEND_PORT:-8080}:8080"
    healthcheck:
      # The slim image has no curl/wget, so use bash's built-in TCP support.
      test: ["CMD", "bash", "-c", "exec 3<>/dev/tcp/127.0.0.1/8080 && printf 'GET /actuator/health HTTP/1.0\\r\\n\\r\\n' >&3 && grep -q '\"status\":\"UP\"' <&3"]
      interval: 5s
      timeout: 5s
      retries: 20
      start_period: 20s

  frontend:
    build: ./frontend
    depends_on:
      backend:
        condition: service_healthy
    environment:
      BACKEND_URL: http://backend:8080
    ports:
      - "${FRONTEND_PORT:-3000}:3000"
    healthcheck:
      test: ["CMD", "node", "-e", "fetch('http://127.0.0.1:3000/healthz').then(r => process.exit(r.ok ? 0 : 1)).catch(() => process.exit(1))"]
      interval: 10s
      timeout: 5s
      retries: 5

volumes:
  pgdata:
