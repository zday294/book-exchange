# Local development Postgres. Credentials here are for local use only.
# Start:  docker compose up -d db
# Reset:  docker compose down -v   (wipes the data; the backend re-applies the Liquibase changelog)
# The database starts empty: the backend's Liquibase changelog creates the schema.
services:
  db:
    image: postgres:17
    environment:
      POSTGRES_DB: bookexchange
      POSTGRES_USER: bookexchange
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-bookexchange}
    ports:
      - "${POSTGRES_PORT:-5433}:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U bookexchange -d bookexchange"]
      interval: 5s
      timeout: 3s
      retries: 10

volumes:
  pgdata:
